name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libvulkan-dev libxkbcommon-dev python3-pil
      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Documentation checks
        run: |
          python3 tools/check_docs.py
          # Tool tests, excluding the host-only theme-watch test: it needs
          # the APCA Rust helper sources under
          # ~/.local/share/worldwall-theme-sync/apca-helper, which are not
          # in this repository and so cannot run in a fresh checkout or CI.
          python3 tools/run_ci_tool_tests.py
