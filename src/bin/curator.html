<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worldwall scene-pool curator</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #14161a; color: #e6e6e6; }
  header { display: flex; align-items: baseline; gap: 1rem; padding: 0.6rem 1rem; background: #1d2026; }
  header h1 { font-size: 1.05rem; margin: 0; }
  #status { color: #9ad1a4; }
  #status.error { color: #ff9d9d; }
  main { display: grid; grid-template-columns: 320px minmax(320px, 1fr) 360px; gap: 0.75rem; padding: 0.75rem; }
  section { background: #1d2026; border-radius: 6px; padding: 0.6rem 0.75rem; min-height: 0; }
  h2 { font-size: 0.95rem; margin: 0.4rem 0; }
  #search { width: 100%; box-sizing: border-box; margin-bottom: 0.4rem; }
  #scene-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 72vh; }
  #scene-list li { display: flex; gap: 0.5rem; align-items: center; padding: 0.25rem; border-radius: 4px; cursor: pointer; }
  #scene-list li:hover { background: #262b33; }
  #scene-list li[aria-selected="true"] { background: #2e3a4d; outline: 1px solid #5b7bb4; }
  #scene-list canvas { width: 48px; height: 48px; image-rendering: pixelated; background: #000; flex: none; }
  .badge { font-size: 0.75rem; padding: 0 0.35rem; border-radius: 3px; background: #333a45; }
  .badge.ok { background: #24472e; }
  .badge.no { background: #4d2a2a; }
  #preview { width: 100%; image-rendering: pixelated; background: #000; border-radius: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.4rem 0; }
  label { display: inline-flex; gap: 0.3rem; align-items: center; }
  button { background: #2e3a4d; color: inherit; border: 1px solid #4a5568; border-radius: 4px; padding: 0.3rem 0.6rem; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, #scene-list:focus-visible { outline: 2px solid #5b7bb4; }
  .row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.25rem 0; }
  #eligibility li { margin-left: 1rem; }
  #self-check.ok { color: #9ad1a4; }
  #self-check.no { color: #ff9d9d; }
  .hint { color: #9aa3af; font-size: 0.8rem; }
  fieldset { border: 1px solid #333a45; border-radius: 4px; margin: 0.35rem 0; }
</style>
</head>
<body>
<header>
  <h1>Worldwall scene-pool curator</h1>
  <div id="status">Loading catalog…</div>
</header>
<main>
  <section id="library" aria-label="Scene library">
    <h2>Library</h2>
    <input id="search" type="search" placeholder="Search scenes" aria-label="Search scenes">
    <ul id="scene-list" tabindex="0" role="listbox" aria-label="Scenes"></ul>
  </section>
  <section id="detail" aria-label="Preview">
    <h2 id="scene-title">No scene selected</h2>
    <canvas id="preview" width="320" height="180"></canvas>
    <div class="controls">
      <label>Play <input id="play" type="checkbox" checked></label>
      <label>Time-of-day <input id="tod" type="range" min="0" max="86399" value="43200"></label>
      <span id="tod-label">12:00</span>
    </div>
    <div id="scene-info" class="hint"></div>
    <div id="self-check"></div>
    <h2>Preview snapshot</h2>
    <div class="controls">
      <label>Weather <select id="snap-weather">
        <option selected>clear</option><option>cloudy</option><option>rain</option><option>snow</option>
        <option>storm</option><option>fog</option><option value="unknown">unknown</option>
      </select></label>
      <label>°C <input id="snap-temp" type="number" step="0.5" value="20" style="width:5rem"></label>
    </div>
    <div class="hint">Preview state only (time comes from the slider); it never changes runtime selection.</div>
  </section>
  <section id="rules-panel" aria-label="Pool rules">
    <h2>Scene rule</h2>
    <div id="rule-editor"></div>
    <h2>Pools</h2>
    <div id="pools"></div>
    <div class="controls">
      <button id="save">Save sidecar</button>
      <button id="reload">Request config reload</button>
    </div>
    <div id="rules-path" class="hint"></div>
    <h2>Eligibility</h2>
    <ul id="eligibility"></ul>
  </section>
</main>
<script src="palette.js"></script>
<script src="pools.js"></script>
<script src="app.js"></script>
</body>
</html>
