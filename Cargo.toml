[package]
name = "worldwall"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "GPU-accelerated indexed pixel-art wallpaper engine for Hyprland/Wayland"

[dependencies]
calloop = "=0.14.4"
calloop-wayland-source = "=0.4.1"
png = "=0.17.16"
pollster = "=0.4.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.149"
zbus = { version = "=5.14.0", default-features = true }
# zbus 5.14's proc-macro API must stay paired with its 5.14 macro crate.
zbus_macros = "=5.14.0"
raw-window-handle = "=0.6.2"
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop"] }
wayland-client = { version = "=0.31.15", default-features = false, features = ["system"] }
wayland-protocols = { version = "=0.32.13", default-features = false, features = ["client", "staging"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "deny"
correctness = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
